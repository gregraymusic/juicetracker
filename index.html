<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rehearsal & Snack Hub</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 100vh;
    }

    .main-container {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #ffffff;
      margin: 5px 0 10px 0;
      font-size: 1.8rem;
    }

    /* Group Toggle Buttons Styling */
    .band-toggle-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .band-btn {
      background-color: #2c2c2c;
      color: #888;
      border: 2px solid #444;
      padding: 10px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .band-btn.active-blue {
      background-color: #1e3a5f;
      color: #64b5f6;
      border-color: #2196f3;
      box-shadow: 0 0 8px rgba(33, 150, 243, 0.4);
    }

    .band-btn.active-gold {
      background-color: #5d4037;
      color: #ffd54f;
      border-color: #ffb300;
      box-shadow: 0 0 8px rgba(255, 179, 0, 0.4);
    }

    /* Section Headers & Warm-Up Container */
    .section-title {
      color: #bb86fc;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 6px;
      text-align: center;
    }

    .warmup-container {
      margin-bottom: 20px;
      text-align: center;
    }

    .warmup-input {
      width: 100%;
      background-color: #1e1e1e;
      color: #ffffff;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px;
      font-size: 1.1rem;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .warmup-input:focus {
      outline: none;
      border-color: #bb86fc;
      background-color: #282828;
    }

    /* Generic Table Styling */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e1e1e;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #333;
      padding: 10px 5px;
      text-align: center;
      vertical-align: middle;
    }

    th {
      background-color: #2c2c2c;
      color: #bb86fc;
      font-size: 0.95rem;
    }

    tr:nth-child(even) {
      background-color: #252525;
    }

    .section-header-row th {
      background-color: #1f1f1f;
      color: #03dac6;
      font-size: 1.1rem;
      padding: 8px;
    }

    /* Input Fields Styling */
    .name-input, .page-input {
      width: 90%;
      background-color: #2e2e2e;
      color: #ffffff;
      border: 2px solid #444;
      border-radius: 4px;
      padding: 8px 4px;
      font-size: 0.95rem;
      text-align: center;
      transition: all 0.3s ease;
    }

    .page-input {
      background-color: #252525;
      border-color: #383838;
      color: #03dac6;
    }

    /* Colored reminder state for snack tracker */
    .name-input.needs-selection-blue {
      background-color: #1a2736;
      border-color: #2196f3;
      color: #90caf9;
    }

    .name-input.needs-selection-gold {
      background-color: #2d241e;
      border-color: #ffb300;
      color: #ffe082;
    }

    .name-input.completed {
      background-color: #2e2e2e;
      border-color: #444;
      color: #ffffff;
    }

    .name-input:focus, .page-input:focus {
      outline: none;
      border-color: #bb86fc !important;
      background-color: #383838 !important;
    }

    input[type="radio"] {
      width: 32px;
      height: 32px;
      cursor: pointer;
      accent-color: #bb86fc;
      vertical-align: middle;
    }

    .totals-row {
      font-weight: bold;
      background-color: #2c2c2c;
      color: #03dac6;
    }

    .totals-row td {
      font-size: 1.3rem;
      padding: 12px 5px;
      line-height: 1.2;
    }

    .totals-label {
      font-size: 1rem !important;
    }
  </style>
</head>
<body>

  <div class="main-container">
    
    <h1 id="rehearsal-title">Blue Band Rehearsal</h1>

    <div class="band-toggle-container">
      <button id="btn-blue" class="band-btn active-blue" onclick="switchBand('blue')">Blue Band</button>
      <button id="btn-gold" class="band-btn" onclick="switchBand('gold')">Gold Band</button>
    </div>

    <div class="warmup-container">
      <div class="section-title">Warm-Up</div>
      <input 
        type="text" 
        id="warmup-input" 
        class="warmup-input" 
        placeholder="Enter today's warm-up routine..."
        oninput="saveWarmup()"
      >
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr class="section-header-row">
            <th colspan="8">Instrument Assignments & Music Pages</th>
          </tr>
          <tr>
            <th>Lead</th>
            <th>Doubles</th>
            <th>Lead</th>
            <th>Xylo.</th>
            <th>Lead</th>
            <th>Bass</th>
            <th>Glock.</th>
            <th>Triples</th>
          </tr>
        </thead>
        <tbody id="instrument-body">
          </tbody>
      </table>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr class="section-header-row">
            <th colspan="6">Snack Time & Attendance Tracker</th>
          </tr>
          <tr>
            <th>Student Name</th>
            <th>Very Berry</th>
            <th>Apple</th>
            <th>Fruit Punch</th>
            <th>No Juice</th>
            <th>Absent</th>
          </tr>
        </thead>
        <tbody id="tracker-body">
          </tbody>
        <tfoot>
          <tr class="totals-row">
            <td class="totals-label">Total Count</td>
            <td id="count-berry">0 Very Berry</td>
            <td id="count-apple">0 Apple</td>
            <td id="count-punch">0 Fruit Punch</td>
            <td id="count-none">0 No Juice</td>
            <td id="count-absent">0 Absent</td>
          </tr>
        </tfoot>
      </table>
    </div>

  </div>

  <script>
    const totalStudents = 8;
    const trackerBody = document.getElementById('tracker-body');
    const instrumentBody = document.getElementById('instrument-body');
    const warmupInput = document.getElementById('warmup-input');
    const rehearsalTitle = document.getElementById('rehearsal-title');
    
    const options = ['berry', 'apple', 'punch', 'none', 'absent'];
    const optionLabels = {
      berry: 'Very Berry',
      apple: 'Apple',
      punch: 'Fruit Punch',
      none: 'No Juice',
      absent: 'Absent'
    };

    let currentBand = 'blue';

    // Renders both the instrument page chart and snack tracker
    function renderApp() {
      // 1. Update Title Header
      rehearsalTitle.textContent = currentBand === 'blue' ? 'Blue Band Rehearsal' : 'Gold Band Rehearsal';

      // 2. Load Saved Warm-Up Text
      warmupInput.value = localStorage.getItem(`${currentBand}_warmup`) || '';

      // 3. Render Instrument Assignment Section
      instrumentBody.innerHTML = '';
      
      const rowNames = document.createElement('tr');
      const rowPages = document.createElement('tr');

      for (let i = 1; i <= totalStudents; i++) {
        const nameVal = localStorage.getItem(`${currentBand}_student_name_${i}`) || '';
        const pageVal = localStorage.getItem(`${currentBand}_student_page_${i}`) || '';

        // Name input box synced with main student slot
        rowNames.innerHTML += `
          <td>
            <input 
              type="text" 
              class="name-input" 
              id="inst-name-${i}" 
              placeholder="Student ${i}" 
              value="${nameVal}"
              oninput="syncStudentName(${i}, this.value)"
            >
          </td>`;

        // Page number input box
        rowPages.innerHTML += `
          <td>
            <input 
              type="text" 
              class="page-input" 
              id="inst-page-${i}" 
              placeholder="Pg #" 
              value="${pageVal}"
              oninput="savePage(${i}, this.value)"
            >
          </td>`;
      }

      instrumentBody.appendChild(rowNames);
      instrumentBody.appendChild(rowPages);

      // 4. Render Attendance & Snack Tracker
      trackerBody.innerHTML = '';

      for (let i = 1; i <= totalStudents; i++) {
        const row = document.createElement('tr');
        const savedName = localStorage.getItem(`${currentBand}_student_name_${i}`) || '';

        let rowContent = `
          <td>
            <input 
              type="text" 
              class="name-input" 
              id="student-input-${i}"
              placeholder="Student ${i}" 
              value="${savedName}"
              oninput="syncStudentName(${i}, this.value)"
            >
          </td>`;

        options.forEach(option => {
          rowContent += `
            <td>
              <input 
                type="radio" 
                name="student-${i}" 
                value="${option}" 
                onclick="handleRadioClick(this, ${i})"
              >
            </td>`;
        });

        row.innerHTML = rowContent;
        trackerBody.appendChild(row);

        updateRowStatus(i);
      }

      updateTotals();
    }

    // Save warm-up routine per group
    function saveWarmup() {
      localStorage.setItem(`${currentBand}_warmup`, warmupInput.value);
    }

    // Sync student name inputs across both tables automatically
    function syncStudentName(index, value) {
      localStorage.setItem(`${currentBand}_student_name_${index}`, value);
      
      const inputSnack = document.getElementById(`student-input-${index}`);
      const inputInst = document.getElementById(`inst-name-${index}`);

      if (inputSnack && inputSnack.value !== value) inputSnack.value = value;
      if (inputInst && inputInst.value !== value) inputInst.value = value;

      updateRowStatus(index);
    }

    // Save individual page numbers
    function savePage(index, value) {
      localStorage.setItem(`${currentBand}_student_page_${index}`, value);
    }

    // Toggle radio selection on second tap
    function handleRadioClick(radio, studentIndex) {
      if (radio.dataset.wasChecked === "true") {
        radio.checked = false;
        radio.dataset.wasChecked = "false";
      } else {
        const radiosInRow = document.querySelectorAll(`input[name="student-${studentIndex}"]`);
        radiosInRow.forEach(r => r.dataset.wasChecked = "false");
        radio.dataset.wasChecked = "true";
      }

      updateRowStatus(studentIndex);
      updateTotals();
    }

    // Update name input highlight status
    function updateRowStatus(index) {
      const inputSnack = document.getElementById(`student-input-${index}`);
      if (!inputSnack) return;

      const isTyped = inputSnack.value.trim().length > 0;
      const isOptionSelected = document.querySelector(`input[name="student-${index}"]:checked`) !== null;

      if (isTyped && !isOptionSelected) {
        inputSnack.className = `name-input needs-selection-${currentBand}`;
      } else {
        inputSnack.className = 'name-input completed';
      }
    }

    function switchBand(band) {
      currentBand = band;
      
      const btnBlue = document.getElementById('btn-blue');
      const btnGold = document.getElementById('btn-gold');

      if (band === 'blue') {
        btnBlue.className = 'band-btn active-blue';
        btnGold.className = 'band-btn';
      } else {
        btnBlue.className = 'band-btn';
        btnGold.className = 'band-btn active-gold';
      }

      renderApp();
    }

    function updateTotals() {
      options.forEach(option => {
        const selected = document.querySelectorAll(`input[value="${option}"]:checked`);
        const count = selected.length;
        const label = optionLabels[option];
        
        document.getElementById(`count-${option}`).textContent = `${count} ${label}`;
      });
    }

    renderApp();
  </script>

</body>
</html>
